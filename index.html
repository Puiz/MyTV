<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MY TV</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><meta name="theme-color" content="#12091f">
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.8/hls.min.js"></script>
<style>
:root{--bg:#12091f;--bg2:#1c1230;--ac:#b57edc;--tx:#f3eefa;--mu:#a99bc2;box-sizing:border-box}
*{box-sizing:inherit;margin:0}
html,body{background:var(--bg);color:var(--tx);font-family:Anuphan,"Noto Sans Thai",sans-serif;font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:var(--bg2);border:0;border-radius:10px;padding:10px 16px}
input,select,textarea{background:var(--bg2);border:1px solid #3a2b58;border-radius:10px;padding:10px 12px;width:100%}
textarea{min-height:90px}
:focus-visible,[data-f]:focus{outline:3px solid #fff;outline-offset:2px}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:20px;padding:max(12px,env(safe-area-inset-top)) 4vw 10px;background:linear-gradient(var(--bg) 70%,transparent)}
.logo{font-weight:700;font-size:20px;white-space:nowrap;color:var(--ac)}
nav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
nav button{background:none;color:var(--mu);font-weight:600;white-space:nowrap;border-bottom:3px solid transparent;border-radius:0}
nav button.on{color:var(--tx);border-color:var(--ac)}
main{padding:0 4vw 60px}
.hero{min-height:46vh;border-radius:16px;background:#2a1b45 center/cover;display:flex;align-items:flex-end;padding:4vw;margin-bottom:24px}
.hero h1{font-size:clamp(26px,4.5vw,56px);line-height:1.2;max-width:14em}
.hero p{max-width:40em;color:#ddd3ee;margin:10px 0 16px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pri{background:var(--ac);color:#1a0b2b;font-weight:700}
h2{font-size:20px;margin:22px 0 10px}
.row{display:flex;gap:14px;overflow-x:auto;padding:6px 4px 14px;scrollbar-width:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:16px;padding:6px 4px}
.card{position:relative;flex:0 0 150px;aspect-ratio:2/3;padding:0;overflow:hidden;background:linear-gradient(160deg,#3b2563,#1c1230);text-align:left}
.grid .card{flex:none;width:100%}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card span{position:absolute;left:0;right:0;bottom:0;padding:24px 8px 8px;font-size:13px;font-weight:600;background:linear-gradient(transparent,#000c);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card:focus{transform:scale(1.06);z-index:2}
.empty{padding:12vh 0;text-align:center;color:var(--mu)}.empty button{margin-top:16px}
.ov{position:fixed;inset:0;z-index:20;display:none;background:#000d;overflow:auto;padding:4vw}
.ov.on{display:block}
.box{max-width:980px;margin:0 auto;background:var(--bg);border-radius:16px;padding:22px}
.dt{display:flex;gap:22px}.dp{width:200px;aspect-ratio:2/3;object-fit:cover;border-radius:12px;background:var(--bg2);flex:none}
.meta{color:var(--mu);margin:4px 0 12px}.btns,.eps{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.pane{background:var(--bg2);border-radius:14px;padding:18px;margin-bottom:18px;display:grid;gap:10px}
.pane h2{margin:0}.pane input,.pane select,.pane textarea{background:var(--bg)}
.fg{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}
.it{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid #3a2b58}
.cand{display:flex;gap:10px;text-align:left;width:100%;background:var(--bg);margin-bottom:6px}.cand img{width:46px;border-radius:6px}
.cand small{color:var(--mu)}
#pl{position:fixed;inset:0;z-index:30;background:#000;display:none}#pl.on{display:block}
#v{width:100%;height:100%;background:#000}
#bar{position:absolute;top:0;left:0;right:0;display:flex;gap:8px;align-items:center;padding:10px 14px;background:linear-gradient(#000c,transparent)}#bar b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#perr{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;background:#000b}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ac);color:#1a0b2b;padding:10px 18px;border-radius:99px;font-weight:700;z-index:50;display:none}
@media(max-width:700px){.dt{flex-direction:column}.dp{width:130px}.fg{grid-template-columns:1fr}.logo{font-size:16px}header{gap:10px}}
@media(min-width:1200px){html{font-size:20px}.card{flex-basis:200px}.grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.card{transition:transform .12s}
</style></head><body>
<header><div class="logo">▶ MY TV</div><nav id="nav"></nav></header>
<main id="main"></main>
<div class="ov" id="modal"><div class="box" id="mc"></div></div>
<div id="pl"><video id="v" controls autoplay playsinline></video><iframe id="ifr" allowfullscreen allow="autoplay; fullscreen; encrypted-media" sandbox="allow-scripts allow-same-origin allow-forms allow-presentation" style="display:none;width:100%;height:100%;border:0;background:#000"></iframe><div id="bar"><button data-f data-act="pclose">✕ ปิด</button><button data-f data-act="pprev">⏮</button><button data-f data-act="pnext">⏭</button><button data-f data-act="popen" id="popen" style="display:none">↗ เปิดในแท็บใหม่</button><b id="pt"></b></div><div id="perr"><div><p>เล่นวิดีโอไม่ได้ ลิงก์อาจเสียหรือเซิร์ฟเวอร์ไม่อนุญาต</p><p><button data-f data-act="pclose">กลับ</button></p></div></div></div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s),K='mytv.v1',CATS={movie:'หนัง',series:'ซีรีส์',anime:'อนิเมะ'},
NAV=[['home','หน้าแรก'],['movie','หนัง'],['series','ซีรีส์'],['anime','อนิเมะ'],['search','ค้นหา'],['list','รายการของฉัน'],['admin','จัดการ']];
let db=load(),view='home',unlocked=false,editing=null,tmRes=[],cur=null,hls=null;
function load(){try{const d=JSON.parse(localStorage.getItem(K));if(d&&Array.isArray(d.items))return{items:d.items,list:d.list||[],settings:Object.assign({pin:'1234',tmdb:''},d.settings)}}catch(e){}return{items:[],list:[],settings:{pin:'1234',tmdb:''}}}
function save(){try{localStorage.setItem(K,JSON.stringify(db));return true}catch(e){toast('บันทึกไม่สำเร็จ พื้นที่เก็บข้อมูลเต็ม');return false}}
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const byId=id=>db.items.find(i=>i.id===id),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
let tt;function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(tt);tt=setTimeout(()=>e.style.display='none',2600)}
const card=i=>`<button class="card" data-f data-id="${esc(i.id)}">${i.poster?`<img loading="lazy" src="${esc(i.poster)}" alt="" onerror="this.remove()">`:''}<span>${esc(i.title)}</span></button>`;
const row=(t,a)=>a.length?`<section><h2>${t}</h2><div class="row">${a.map(card).join('')}</div></section>`:'';
function render(){
 $('#nav').innerHTML=NAV.map(([k,t])=>`<button data-f data-nav="${k}" class="${view===k?'on':''}">${t}</button>`).join('');
 const m=$('#main'),a=db.items;
 if(view==='home'){
  if(!a.length){m.innerHTML=`<div class="empty"><h2>ยังไม่มีเรื่องในแอป</h2><p>เพิ่มเรื่องแรกได้ที่เมนู “จัดการ”</p><button class="pri" data-f data-nav="admin">ไปที่หลังบ้าน</button></div>`;return}
  const f=a.slice().reverse().find(i=>i.backdrop)||a[a.length-1],bg=f.backdrop||f.poster;
  m.innerHTML=`<div class="hero" id="hero"><div><h1>${esc(f.title)}</h1><p>${esc(f.overview||'')}</p><button class="pri" data-f data-id="${esc(f.id)}">▶ ดูรายละเอียด</button></div></div>`+
  row('อัปเดตล่าสุด',a.slice().reverse().slice(0,20))+Object.keys(CATS).map(c=>row(CATS[c],a.filter(i=>i.cat===c).reverse().slice(0,30))).join('')+row('รายการของฉัน',db.list.map(byId).filter(Boolean));
  if(bg)$('#hero').style.backgroundImage=`linear-gradient(90deg,#12091fee 20%,#12091f55),url("${bg.replace(/"/g,'%22')}")`;
 }else if(CATS[view]){const x=a.filter(i=>i.cat===view).reverse();m.innerHTML=`<h2>${CATS[view]} (${x.length})</h2>`+(x.length?`<div class="grid">${x.map(card).join('')}</div>`:'<div class="empty">ยังไม่มีเรื่องในหมวดนี้</div>')}
 else if(view==='list'){const x=db.list.map(byId).filter(Boolean);m.innerHTML=`<h2>รายการของฉัน</h2>`+(x.length?`<div class="grid">${x.map(card).join('')}</div>`:'<div class="empty">กด “+ รายการของฉัน” ในหน้ารายละเอียดเพื่อเก็บเรื่องที่ชอบ</div>')}
 else if(view==='search'){m.innerHTML=`<h2>ค้นหา</h2><input id="q" data-f placeholder="พิมพ์ชื่อเรื่อง" autocomplete="off"><div id="res" class="grid"></div>`}
 else m.innerHTML=admin();
 if(view==='admin'&&unlocked){renderList();if(editing)setForm(byId(editing))}
}
function admin(){
 if(!unlocked)return`<div class="pane" style="max-width:420px"><h2>ระบบหลังบ้าน</h2><p>ใส่รหัส PIN (ค่าเริ่มต้นคือ 1234 เปลี่ยนได้ในหัวข้อตั้งค่า)</p><input id="pin" type="password" inputmode="numeric" data-f><button class="pri" data-f data-act="unlock">เข้าสู่ระบบ</button></div>`;
 return`<div class="pane"><h2 id="ft">${editing?'แก้ไขเรื่อง':'เพิ่มเรื่องใหม่'}</h2>
 <div class="fg"><input id="f_title" data-f placeholder="ชื่อเรื่อง"><input id="f_year" data-f placeholder="ปี เช่น 2024" inputmode="numeric"><select id="f_cat" data-f>${Object.keys(CATS).map(c=>`<option value="${c}">${CATS[c]}</option>`).join('')}</select></div>
 <button data-f data-act="tmdb">ค้นหาและตรวจสอบจาก TMDB</button><div id="tm"></div>
 <input id="f_poster" data-f placeholder="ลิงก์โปสเตอร์"><input id="f_back" data-f placeholder="ลิงก์ภาพพื้นหลัง (ไม่บังคับ)"><textarea id="f_over" data-f placeholder="เรื่องย่อ"></textarea>
 <textarea id="f_src" data-f placeholder="ลิงก์วิดีโอ บรรทัดละ 1 รายการ รูปแบบ ชื่อ|ลิงก์ เช่น&#10;พากย์ไทย|https://example.com/a.m3u8&#10;ตอนที่ 1|https://example.com/ep1.mp4&#10;หน้าเว็บฝัง|embed:https://example.com/player"></textarea>
 <div class="btns"><button class="pri" data-f data-act="save">บันทึก</button><button data-f data-act="clear">ล้างฟอร์ม</button></div></div>
 <div class="pane"><h2>นำเข้าจากไฟล์ M3U</h2><p style="color:var(--mu)">นำเข้าเฉพาะลิงก์ที่คุณมีสิทธิ์ใช้งาน เช่น ไฟล์ของคุณเอง ช่องฟรี หรือบริการที่สมัครไว้</p>
 <select id="m_cat" data-f>${Object.keys(CATS).map(c=>`<option value="${c}">${CATS[c]}</option>`).join('')}</select><input type="file" id="m_file" data-f accept=".m3u,.m3u8,.txt"><textarea id="m_txt" data-f placeholder="หรือวางเนื้อหา M3U ที่นี่"></textarea><button data-f data-act="import">นำเข้า</button></div>
 <div class="pane"><h2>รายการทั้งหมด (${db.items.length})</h2><input id="flt" data-f placeholder="กรองตามชื่อ"><div class="btns"><select id="d_cat" data-f style="width:auto"><option value="all">ทุกหมวด</option>${Object.keys(CATS).map(c=>`<option value="${c}">${CATS[c]}</option>`).join('')}</select><button data-f data-act="delall">ลบทั้งหมดตามหมวดที่เลือก</button></div><div id="lst"></div></div>
 <div class="pane"><h2>ตั้งค่าและสำรองข้อมูล</h2><input id="s_tmdb" data-f placeholder="TMDB API Key (สมัครฟรีที่ themoviedb.org)" value="${esc(db.settings.tmdb)}"><input id="s_pin" data-f placeholder="PIN ใหม่" value="${esc(db.settings.pin)}">
 <div class="btns"><button class="pri" data-f data-act="sset">บันทึกการตั้งค่า</button><button data-f data-act="export">ดาวน์โหลดสำรองข้อมูล</button><button data-f data-act="impjson">กู้คืนจากไฟล์สำรอง</button><button data-f data-act="lock">ออกจากหลังบ้าน</button></div><input type="file" id="j_file" accept=".json" hidden></div>`}
function renderList(){const q=($('#flt')||{}).value||'',x=db.items.filter(i=>i.title.toLowerCase().includes(q.toLowerCase())).reverse(),L=$('#lst');
 L.innerHTML=x.slice(0,100).map(i=>`<div class="it"><span>${esc(i.title)} <small style="color:var(--mu)">${CATS[i.cat]} · ${i.sources.length} ลิงก์</small></span><span><button data-f data-edit="${esc(i.id)}">แก้ไข</button> <button data-f data-del="${esc(i.id)}">ลบ</button></span></div>`).join('')+(x.length>100?`<p style="color:var(--mu)">แสดง 100 จาก ${x.length} รายการ ใช้ช่องกรองเพื่อค้นหา</p>`:'')||'<p style="color:var(--mu)">ยังไม่มีรายการ</p>'}
function setForm(it){if(!it)return;f_title.value=it.title;f_year.value=it.year||'';f_cat.value=it.cat;f_poster.value=it.poster||'';f_back.value=it.backdrop||'';f_over.value=it.overview||'';f_src.value=it.sources.map(s=>s.label+'|'+(s.embed?'embed:':'')+s.url).join('\n')}
function saveItem(){const t=f_title.value.trim(),srcs=[];
 if(!t)return toast('ใส่ชื่อเรื่องก่อน');
 for(const l of f_src.value.split('\n')){const s=l.trim();if(!s)continue;const p=s.indexOf('|'),hasL=p>0&&!/^https?:/i.test(s.slice(0,p)),label=hasL?s.slice(0,p).trim():'เล่น',raw=(hasL?s.slice(p+1):s).trim(),emb=/^embed:/i.test(raw),url=emb?raw.slice(6).trim():raw;
  if(!/^https?:\/\/\S+$/i.test(url))return toast('ลิงก์ไม่ถูกต้อง: '+s.slice(0,40));srcs.push(emb?{label,url,embed:true}:{label,url})}
 if(!srcs.length)return toast('ใส่ลิงก์วิดีโออย่างน้อย 1 ลิงก์');
 const o={title:t,year:f_year.value.trim(),cat:f_cat.value,poster:f_poster.value.trim(),backdrop:f_back.value.trim(),overview:f_over.value.trim(),sources:srcs};
 if(editing)Object.assign(byId(editing),o);else db.items.push(Object.assign({id:uid()},o));
 if(save()){toast('บันทึกแล้ว');editing=null;render()}}
async function tmdb(){const k=db.settings.tmdb,t=f_title.value.trim(),y=f_year.value.trim(),c=f_cat.value;
 if(!k)return toast('ใส่ TMDB API Key ในหัวข้อตั้งค่าก่อน');if(!t)return toast('ใส่ชื่อเรื่องก่อน');
 const ty=c==='movie'?'movie':'tv',yp=y?(ty==='movie'?'&year=':'&first_air_date_year=')+encodeURIComponent(y):'',bearer=k.length>40;
 $('#tm').innerHTML='กำลังค้นหา...';
 try{const r=await fetch(`https://api.themoviedb.org/3/search/${ty}?language=th-TH&query=${encodeURIComponent(t)}${yp}${bearer?'':'&api_key='+encodeURIComponent(k)}`,bearer?{headers:{Authorization:'Bearer '+k}}:{});
  if(!r.ok)throw 0;tmRes=((await r.json()).results||[]).slice(0,6);
  $('#tm').innerHTML=tmRes.length?`<p style="color:var(--mu)">ตรวจชื่อและปีให้ตรงกับเรื่องที่ต้องการ แล้วกดเลือก</p>`+tmRes.map((x,i)=>`<button class="cand" data-f data-tm="${i}">${x.poster_path?`<img src="https://image.tmdb.org/t/p/w92${x.poster_path}" alt="">`:''}<span>${esc(x.title||x.name)} (${(x.release_date||x.first_air_date||'').slice(0,4)||'?'})<br><small>${esc((x.overview||'ไม่มีเรื่องย่อ').slice(0,120))}</small></span></button>`).join(''):'ไม่พบเรื่องนี้ ลองแก้ชื่อหรือปี'
 }catch(e){$('#tm').innerHTML='เชื่อมต่อ TMDB ไม่ได้ ตรวจ API Key และอินเทอร์เน็ต'}}
function parseM3U(txt){const out=[];let m=null;for(const raw of txt.split(/\r?\n/)){const l=raw.trim();
 if(l.startsWith('#EXTINF'))m={logo:(l.match(/tvg-logo="([^"]*)"/)||[])[1]||'',name:l.slice(l.lastIndexOf(',')+1).trim()};
 else if(l&&!l.startsWith('#')){if(m&&m.name&&/^https?:\/\/\S+$/i.test(l))out.push(Object.assign({url:l},m));m=null}}return out}
function importM3U(txt,cat){let n=0;for(const e of parseM3U(txt)){const mm=e.name.match(/\(([^()]*)\)\s*$/),lang=mm&&/พากย์|ซับ|sub|dub/i.test(mm[1])?mm[1]:'',nm=lang?e.name.slice(0,mm.index).trim():e.name,
 yr=(nm.match(/\((\d{4})\)/)||[])[1]||'',base=nm.replace(/\(\d{4}\)/,'').replace(/\s+/g,' ').trim(),ex=db.items.find(i=>i.cat===cat&&i.title.toLowerCase()===base.toLowerCase()),s={label:lang||'เล่น',url:e.url};
 if(ex){if(!ex.sources.some(x=>x.url===s.url)){ex.sources.push(s);n++}}else{db.items.push({id:uid(),title:base,year:yr,cat,poster:e.logo,backdrop:'',overview:'',sources:[s]});n++}}
 return n}
function detail(id){const it=byId(id);if(!it)return;const fav=db.list.includes(id);
 $('#mc').innerHTML=`<div class="dt">${it.poster?`<img class="dp" src="${esc(it.poster)}" alt="" onerror="this.style.visibility='hidden'">`:'<div class="dp"></div>'}<div><h1>${esc(it.title)}</h1><p class="meta">${CATS[it.cat]}${it.year?' · '+esc(it.year):''}</p><p>${esc(it.overview||'ยังไม่มีเรื่องย่อ')}</p>
 <div class="btns"><button class="pri" data-f data-play="${esc(id)}:0" id="pbtn">▶ เล่น</button><button data-f data-fav="${esc(id)}">${fav?'✓ อยู่ในรายการของฉัน':'+ รายการของฉัน'}</button><button data-f data-close>ปิด</button></div>
 ${it.sources.length>1?`<h3>${it.cat==='movie'?'เลือกเวอร์ชัน':'เลือกตอน'}</h3><div class="eps">${it.sources.map((s,i)=>`<button data-f data-play="${esc(id)}:${i}">${esc(s.label)}</button>`).join('')}</div>`:''}</div></div>`;
 $('#modal').classList.add('on');setTimeout(()=>{const b=$('#pbtn');b&&b.focus()},30)}
function perr(){$('#perr').style.display='flex'}
function stop(){const fr=$('#ifr');fr.src='about:blank';fr.style.display='none';$('#popen').style.display='none';const v=$('#v');v.style.display='';if(hls){hls.destroy();hls=null}v.pause();v.removeAttribute('src');v.load()}
function play(id,i){const it=byId(id);if(!it||!it.sources[i])return;cur={id,i};const s=it.sources[i],v=$('#v');stop();$('#perr').style.display='none';
 $('#pl').classList.add('on');$('#pt').textContent=it.title+' · '+s.label;document.activeElement.blur();
 if(s.embed){v.style.display='none';$('#ifr').style.display='block';$('#ifr').src=s.url;$('#popen').style.display='';return}
 if(/\.m3u8/i.test(s.url)){if(v.canPlayType('application/vnd.apple.mpegurl'))v.src=s.url;else if(window.Hls&&Hls.isSupported()){hls=new Hls();hls.loadSource(s.url);hls.attachMedia(v);hls.on(Hls.Events.ERROR,(e,d)=>{if(d.fatal)perr()})}else return perr()}else v.src=s.url;
 v.play().catch(()=>{})}
function step(d){if(!cur)return;const it=byId(cur.id),n=cur.i+d;if(it&&it.sources[n])play(cur.id,n);else toast(d>0?'ถึงรายการสุดท้ายแล้ว':'นี่คือรายการแรก')}
function back(){if($('#pl').classList.contains('on')){stop();$('#pl').classList.remove('on');return true}
 if($('#modal').classList.contains('on')){$('#modal').classList.remove('on');render();return true}
 if(view!=='home'){view='home';render();return true}return false}
document.addEventListener('click',e=>{const t=e.target;if(t.id==='modal'){back();return}
 const b=t.closest('[data-nav],[data-id],[data-play],[data-fav],[data-close],[data-act],[data-tm],[data-edit],[data-del]');if(!b)return;const d=b.dataset;
 if(d.nav){view=d.nav;render();scrollTo(0,0)}
 else if(d.id)detail(d.id);
 else if(d.play!==undefined){const p=d.play.lastIndexOf(':');play(d.play.slice(0,p),+d.play.slice(p+1))}
 else if(d.fav!==undefined){const i=db.list.indexOf(d.fav);i<0?db.list.push(d.fav):db.list.splice(i,1);save();detail(d.fav)}
 else if(d.close!==undefined)back();
 else if(d.tm!==undefined){const x=tmRes[+d.tm];if(!f_title.value.trim())f_title.value=x.title||x.name;if(!f_year.value)f_year.value=(x.release_date||x.first_air_date||'').slice(0,4);
  f_poster.value=x.poster_path?'https://image.tmdb.org/t/p/w500'+x.poster_path:'';f_back.value=x.backdrop_path?'https://image.tmdb.org/t/p/w1280'+x.backdrop_path:'';f_over.value=x.overview||'';$('#tm').innerHTML='';toast('ใส่ข้อมูลจาก TMDB แล้ว')}
 else if(d.edit){editing=d.edit;render();scrollTo(0,0)}
 else if(d.del){const it=byId(d.del);if(it&&confirm('ลบ “'+it.title+'” ?')){db.items=db.items.filter(i=>i.id!==d.del);db.list=db.list.filter(i=>i!==d.del);if(editing===d.del)editing=null;save();render()}}
 else switch(d.act){
  case'unlock':if($('#pin').value===db.settings.pin){unlocked=true;render()}else toast('PIN ไม่ถูกต้อง');break;
  case'delall':{const c=d_cat.value,x=db.items.filter(i=>c==='all'||i.cat===c),nm=c==='all'?'ทุกหมวด':CATS[c];
   if(!x.length){toast('ไม่มีรายการให้ลบ');break}
   if(!confirm('ลบ '+x.length+' รายการในหมวด "'+nm+'" ?\nการลบนี้ย้อนกลับไม่ได้ (แนะนำให้ดาวน์โหลดสำรองข้อมูลก่อน)'))break;
   if(c==='all'&&!confirm('ยืนยันอีกครั้ง: ลบทุกรายการในแอป?'))break;
   const ids=new Set(x.map(i=>i.id));db.items=db.items.filter(i=>!ids.has(i.id));db.list=db.list.filter(i=>!ids.has(i));if(ids.has(editing))editing=null;
   if(save())toast('ลบแล้ว '+x.length+' รายการ');render();break}
  case'lock':unlocked=false;editing=null;render();break;
  case'save':saveItem();break;case'clear':editing=null;render();break;case'tmdb':tmdb();break;
  case'import':{const go=txt=>{const n=importM3U(txt,m_cat.value);save();toast(n?'นำเข้า '+n+' รายการ':'ไม่พบลิงก์ที่นำเข้าได้');render()},f=m_file.files[0];
   if(f){const r=new FileReader();r.onload=()=>go(r.result);r.readAsText(f)}else if(m_txt.value.trim())go(m_txt.value);else toast('เลือกไฟล์หรือวางเนื้อหาก่อน');break}
  case'sset':db.settings.tmdb=s_tmdb.value.trim();db.settings.pin=s_pin.value.trim()||'1234';if(save())toast('บันทึกการตั้งค่าแล้ว');break;
  case'export':{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:'application/json'}));a.download='mytv-backup.json';a.click();break}
  case'impjson':j_file.click();break;
  case'popen':if(cur){const it=byId(cur.id),u=it&&it.sources[cur.i];u&&window.open(u.url,'_blank','noopener')}break;case'pclose':back();break;case'pprev':step(-1);break;case'pnext':step(1);break}});
document.addEventListener('change',e=>{if(e.target.id==='j_file'){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.items))throw 0;if(!confirm('แทนที่ข้อมูลปัจจุบันด้วยไฟล์สำรอง?'))return;localStorage.setItem(K,JSON.stringify(d));db=load();save();toast('กู้คืนแล้ว');render()}catch(x){toast('ไฟล์สำรองไม่ถูกต้อง')}};r.readAsText(f)}});
document.addEventListener('input',e=>{if(e.target.id==='q'){const q=e.target.value.trim().toLowerCase(),x=q?db.items.filter(i=>i.title.toLowerCase().includes(q)):[];$('#res').innerHTML=x.length?x.map(card).join(''):(q?'<p style="color:var(--mu)">ไม่พบเรื่องที่ค้นหา</p>':'')}else if(e.target.id==='flt')renderList()});
function cands(){const r=$('#pl').classList.contains('on')?$('#pl'):$('#modal').classList.contains('on')?$('#modal'):document;return[...r.querySelectorAll('[data-f]')].filter(e=>e.offsetParent!==null&&!e.disabled)}
function move(k){const els=cands(),c=document.activeElement;if(!els.includes(c)){els[0]&&els[0].focus();return}
 const r=c.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let best=null,bs=1e9;
 for(const e of els){if(e===c)continue;const b=e.getBoundingClientRect(),x=b.left+b.width/2-cx,y=b.top+b.height/2-cy;
  const[d,s]=k==='ArrowLeft'?[-x,Math.abs(y)]:k==='ArrowRight'?[x,Math.abs(y)]:k==='ArrowUp'?[-y,Math.abs(x)]:[y,Math.abs(x)];
  if(d>4&&d+s*3<bs){bs=d+s*3;best=e}}
 if(best){best.focus();best.scrollIntoView({block:'center',inline:'center'})}}
document.addEventListener('keydown',e=>{const k=e.key,tag=(document.activeElement||{}).tagName,typing=/INPUT|TEXTAREA|SELECT/.test(tag);
 if(k==='Enter'&&e.target.id==='pin'){document.querySelector('[data-act=unlock]').click();return}
 if(k==='Escape'||k==='GoBack'||[4,10009,461].includes(e.keyCode)||(k==='Backspace'&&!typing)){if(back())e.preventDefault();return}
 if($('#pl').classList.contains('on')){const v=$('#v');
  if(k==='ArrowLeft'||k==='ArrowRight'){v.currentTime+=k==='ArrowLeft'?-10:10;e.preventDefault()}
  else if(k==='ArrowUp'||k==='ArrowDown'){move(k);e.preventDefault()}
  else if((k==='Enter'||k===' ')&&tag!=='BUTTON'){v.paused?v.play():v.pause();e.preventDefault()}
  else if(k==='MediaPlayPause'){v.paused?v.play():v.pause()}return}
 if(typing)return;
 if(k.startsWith('Arrow')){move(k);e.preventDefault()}});
$('#v').addEventListener('error',perr);$('#v').addEventListener('ended',()=>{const it=cur&&byId(cur.id);if(it&&it.sources[cur.i+1])step(1)});
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
</script></body></html>
